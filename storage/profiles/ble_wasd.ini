; BLE WASD Profile - Keyboard + Mouse for Gaming
; Wireless gaming control via BLE with dual control scheme
; Optimized for FPS games, PC gaming without cables

[profile]
name = BLE WASD + Mouse
type = keyboard_mouse
connection_mode = ble
version = 1
author = Juraj Michalek
description = Wireless WASD + mouse via BLE, left joystick WASD, right joystick mouse
joystick_threshold = 0.5

[mapping]
; Left joystick (Joy1) - WASD movement (keyboard)
joy1_up = KEY_W
joy1_down = KEY_S
joy1_left = KEY_A
joy1_right = KEY_D
; Right joystick (Joy2) - Mouse movement (simulated via HID)
joy2_enabled = true
joy2_sensitivity = 0.25  ; Scale factor for smooth mouse movement

[buttons]
; Face buttons (I2C) - Mixed keyboard and mouse
btn_a = KEY_E          ; Use/interact (keyboard)
btn_b = KEY_ENTER      ; Confirm/accept (keyboard)
btn_x = KEY_ESCAPE     ; Back/cancel (keyboard)
btn_y = 0x01           ; Left mouse click (button bitmask)
btn_start = KEY_SPACE  ; Alternative jump/action (keyboard)

[technical]
; Composite BLE HID: Keyboard interface + Mouse interface
; Keyboard (Report ID 1, 8 bytes): WASD keys + modifier keys
; Mouse (Report ID 2, 4 bytes): Movement + button clicks
; Left joystick: WASD keys via keyboard interface
; Right joystick: Mouse movement via mouse interface (scaled to 1/4 speed)
; Button mapping:
;   Y button -> Mouse left click (0x01)
;   B button -> Mouse right click (0x02)
;   X button -> Mouse middle click (0x04)
;   A button -> E key (keyboard)
;   GPIO_41 -> Space key (keyboard)
; Connection: BLE HID, latency ~10-20ms (gaming optimized)
; Perfect for: FPS games, wireless PC gaming, Steam Link
; Gamepad Profile - Standard USB HID Gamepad
; Maps to standard USB HID gamepad conventions per hardwaretester.com
; Axis mapping follows SDL2/XInput standard for maximum compatibility

[profile]
name = Gamepad
type = gamepad
version = 2
author = Juraj Michalek
description = Standard USB HID gamepad with dual analog sticks following SDL2/XInput axis conventions

[mapping]
; Left joystick maps to standard HID axes (SDL2/XInput)
joy1_x_axis = x           ; HID Usage 0x30 (Axis 0, leftx) - Left stick left/right
joy1_y_axis = y           ; HID Usage 0x31 (Axis 1, lefty) - Left stick up/down
; Right joystick maps to standard HID axes
joy2_x_axis = rx          ; HID Usage 0x33 (Axis 3, rightx) - Right stick left/right
joy2_y_axis = ry          ; HID Usage 0x34 (Axis 4, righty) - Right stick up/down

[buttons]
; Face buttons (I2C) map to standard gamepad buttons
btn_a = BUTTON_LEFT       ; Gamepad Button A (primary action)
btn_b = BUTTON_RIGHT      ; Gamepad Button B (secondary action/confirm)
btn_x = BUTTON_LEFT_STICK ; Gamepad Button X (shoulder/back)
btn_y = BUTTON_RIGHT_STICK; Gamepad Button Y (alternate action)
; System button (GPIO) maps to start/pause
btn_start = GPIO_41       ; Gamepad Start/Select button

[technical]
; HID Report Descriptor follows USB HID standard
; Uses 6 axes total: X, Y, Z, Rx, Ry, Rz (Z/Rz unused)
; Signed 16-bit range: -32768 to +32767
; Center position: 0
; Deadzone applied: 1500-2600 (I2C ADC values)
; Button mapping follows standard gamepad layout

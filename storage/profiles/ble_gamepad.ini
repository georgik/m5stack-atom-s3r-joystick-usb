; BLE Gamepad Profile
; Standard gamepad layout with 16 buttons and 4 axes
; Connection mode: Bluetooth Low Energy (BLE)

[profile]
name = BLE Gamepad
type = gamepad
connection_mode = ble
version = 1
author = Juraj Michalek
description = Standard BLE gamepad with dual joysticks and 16 buttons
joystick_threshold = 0.5

[mapping]
; Left joystick (Joy1) - Movement
joy1_enabled = true
joy1_deadzone = 0.1

; Right joystick (Joy2) - Camera/aiming
joy2_enabled = true
joy2_deadzone = 0.1

[buttons]
; Face buttons (I2C) - Standard gamepad layout
btn_a = 0x0001        ; Button 1 (A/Cross)
btn_b = 0x0002        ; Button 2 (B/Circle)
btn_x = 0x0004        ; Button 3 (X/Square)
btn_y = 0x0008        ; Button 4 (Y/Triangle)
btn_start = 0x1000    ; Button 17 (Start)

[technical]
; BLE HID Gamepad (Report ID 3, 6 bytes)
; Byte 0: Buttons 1-8 (bitmask)
; Byte 1: Buttons 9-16 (bitmask)
; Byte 2: Left stick X (-127 to 127)
; Byte 3: Left stick Y (-127 to 127)
; Byte 4: Right stick X (-127 to 127)
; Byte 5: Right stick Y (-127 to 127)
; Connection: BLE HID, advertising name "M5Stack-Joystick"
; Latency: ~10-20ms (BLE connection interval)
; Power: Battery powered, optimized for low consumption
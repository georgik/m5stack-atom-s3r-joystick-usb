; BLE Keyboard Profile - Arrow Keys
; Optimized for wireless keyboard control via BLE
; Perfect for media control, presentations, retro emulation

[profile]
name = BLE Arrows
type = keyboard
connection_mode = ble
version = 1
author = Juraj Michalek
description = Wireless arrow keys via BLE, buttons for ESC/Enter
joystick_threshold = 0.5

[mapping]
; Left joystick (Joy1) - Arrow movement (binary detection)
joy1_up = KEY_ARROW_UP
joy1_down = KEY_ARROW_DOWN
joy1_left = KEY_ARROW_LEFT
joy1_right = KEY_ARROW_RIGHT

; Right joystick (Joy2) - D-pad button actions (binary detection)
joy2_up = KEY_E
joy2_down = KEY_SPACE
joy2_left = KEY_ESCAPE
joy2_right = KEY_ENTER
joy2_enabled = true

[buttons]
; Face buttons (I2C) - Standard gamepad layout
btn_a = KEY_ESCAPE       ; Left button -> ESC (back/cancel)
btn_b = KEY_ENTER        ; Right button -> Enter (confirm/accept)
btn_x = KEY_E            ; Left stick button -> E (use/interact)
btn_y = KEY_SPACE        ; Right stick button -> Space (action)
; System button (GPIO)
btn_start = KEY_SPACE    ; GPIO button -> Space (alternative action)

[technical]
; BLE HID Keyboard (Report ID 1, 8 bytes)
; Byte 0: Modifier keys (CTRL, SHIFT, ALT, GUI)
; Byte 1: Reserved
; Byte 2-7: Keycodes (max 6 keys simultaneous)
; Connection: BLE HID, latency ~10-20ms
; Uses standard HID keycode set (KEY_ARROW_UP, etc.)
; Binary joystick detection: axis values >63 or <-63 trigger key press
; Perfect for: presentations, media control, retro game emulation
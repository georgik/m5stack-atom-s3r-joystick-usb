; WASD Profile - Keyboard + Mouse for Gaming
; Optimized for FPS games with dual control

[profile]
name = WASD + Mouse
type = keyboard_mouse
version = 3
author = Juraj Michalek
description = Left joystick: WASD keys, Right joystick: Mouse, Buttons: Mixed
joystick_threshold = 0.5

[mapping]
; Left joystick (Joy1) - WASD movement (keyboard)
joy1_up = KEY_W
joy1_down = KEY_S
joy1_left = KEY_A
joy1_right = KEY_D
; Right joystick (Joy2) - Mouse movement (USB HID mouse)
joy2_enabled = true
joy2_sensitivity = 0.25  ; Scale factor for smooth mouse movement

[buttons]
; Face buttons (I2C) - Mixed keyboard and mouse
btn_a = KEY_E          ; Use/interact (keyboard)
btn_b = KEY_ENTER      ; Confirm/accept (keyboard)
btn_x = KEY_ESCAPE     ; Back/cancel (keyboard)
btn_y = MOUSE_LEFT     ; Left mouse click (right stick button)
btn_start = KEY_SPACE  ; Alternative jump/action (keyboard)

[technical]
; Composite USB HID: Keyboard interface + Mouse interface
; Left joystick: WASD keys via keyboard interface
; Right joystick: Mouse movement via mouse interface (scaled to 1/4 speed)
; Button mapping:
;   BUTTON_RIGHT_STICK (Y) -> Mouse left click
;   BUTTON_RIGHT (B) -> Mouse right click
;   BUTTON_LEFT_STICK (X) -> Mouse middle click
;   BUTTON_LEFT (A) -> E key (keyboard)
;   GPIO_41 -> Space key (keyboard)
; Threshold: 0.5 = axis values >63 or <-63 trigger action

; Arrows Profile - Keyboard Arrow Keys
; Optimized for DOSBox, retro emulation
; Joystick uses binary threshold detection for arrow keys

[profile]
name = Arrows
type = keyboard
version = 2
author = Juraj Michalek
description = Left joystick: Arrow keys (binary), Buttons: ESC/Enter
joystick_threshold = 0.5

[mapping]
; Left joystick (Joy1) - Arrow movement (binary detection)
; Threshold-based: center=2048, left/up<1200, right/down>2800
joy1_up = KEY_ARROW_UP
joy1_down = KEY_ARROW_DOWN
joy1_left = KEY_ARROW_LEFT
joy1_right = KEY_ARROW_RIGHT

; Right joystick (Joy2) - D-pad button actions (binary detection)
; Maps to face buttons: Left=A(ESC), Right=B(Enter), Up=X(E), Down=Y(Space)
joy2_up = KEY_E
joy2_down = KEY_SPACE
joy2_left = KEY_ESCAPE
joy2_right = KEY_ENTER
joy2_enabled = true

[buttons]
; Face buttons (I2C) - Standard gamepad layout
btn_a = KEY_ESCAPE       ; Left button -> ESC (back/cancel)
btn_b = KEY_ENTER        ; Right button -> Enter (confirm/accept)
btn_x = KEY_E            ; Left stick button -> E (use/interact)
btn_y = KEY_SPACE        ; Right stick button -> Space (action)
; System button (GPIO)
btn_start = KEY_SPACE    ; GPIO button -> Space (alternative action)

[technical]
; Joystick threshold: 0.5 (normalized, range 0.0-1.0)
; Converts to 8-bit axis: threshold * 127 = ~63
; Binary detection: axis values >63 or <-63 trigger key press
; Deadzone: -63 to +63 (no key press)
;
; Left joystick: Arrow keys (movement)
; Right joystick: D-pad actions (duplicate of face buttons)
;   UP -> X button (E/use)
;   DOWN -> Y button (Space/action)
;   LEFT -> A button (ESC/back)
;   RIGHT -> B button (Enter/confirm)
;
; Button mapping matches retro game conventions
